<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chorus · OG Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Mona+Sans:wght@300..700&display=swap" rel="stylesheet">
<style>
:root {
  --cream:        #F4F1EA;
  --warm-white:   #FAF8F4;
  --soft-black:   #1F1B16;
  --soft-black-2: #2B2620;
  --blue-primary: #8FA8C6;
  --blue-soft:    #AFC2D9;
  --blue-deep:    #6F8FB2;
  --clay:         #A89F8D;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
  background: #efefe8;
  font-family: "Mona Sans", system-ui, sans-serif;
  color: var(--soft-black);
  -webkit-font-smoothing: antialiased;
}

/* Soft drop-shadow around the card so users can see its bounds when previewing */
body {
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  width: 1200px;
  height: 630px;
  background: var(--blue-primary);
  padding: 72px 80px;
  position: relative;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: var(--gap, 0);
}

/* ---------- TOP BAR ---------- */
.bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: "Fraunces", Georgia, serif;
  font-size: 30px;
  font-weight: 400;
  letter-spacing: -0.02em;
  color: var(--soft-black);
}
.brand-mark {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--cream);
  display: inline-block;
}
.meta {
  font-family: "Mona Sans", system-ui, sans-serif;
  font-size: 13px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 500;
  color: var(--soft-black);
  opacity: 0.55;
}

/* ---------- HEADLINE ---------- */
.headline-wrap {
  display: flex;
  align-items: center;
}
.headline {
  font-family: "Mona Sans", system-ui, sans-serif;
  font-size: 96px;
  font-weight: 500;
  line-height: 1;
  letter-spacing: -0.04em;
  max-width: 14ch;
  color: var(--soft-black);
}
.headline em {
  font-style: italic;
  color: var(--cream);
  font-weight: 500;
}

/* ---------- BOTTOM ---------- */
.bottom {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 40px;
}
.bottom-left {
  display: flex;
  flex-direction: column;
  gap: 18px;
  max-width: 56ch;
}
.arrow {
  display: block;
}
.subtitle {
  font-size: 22px;
  line-height: 1.45;
  color: var(--soft-black);
  opacity: 0.85;
  max-width: 42ch;
  letter-spacing: -0.005em;
}

.circle {
  width: 138px;
  height: 138px;
  border-radius: 50%;
  background: var(--cream);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-family: "Fraunces", Georgia, serif;
  font-size: 17px;
  letter-spacing: -0.005em;
  color: var(--soft-black);
  line-height: 1.25;
  flex-shrink: 0;
  padding: 0 16px;
}

/* On-screen hint for capture (won't show in screenshot if you crop to card) */
.hint {
  position: fixed;
  bottom: 12px;
  left: 0; right: 0;
  text-align: center;
  font-family: "Mona Sans", system-ui, sans-serif;
  font-size: 11px;
  color: #999;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 500;
}
@media print {
  .hint { display: none; }
}
</style>
</head>
<body>

<div class="card">
  <div class="bar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span>Chorus</span>
    </div>
    <div class="meta">For next-gen capital · 2026</div>
  </div>

  <div class="headline-wrap">
    <h1 class="headline">The identity layer for the next <em>$124&nbsp;trillion.</em></h1>
  </div>

  <div class="bottom">
    <div class="bottom-left">
      <svg class="arrow" width="120" height="20" viewBox="0 0 120 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 10 L110 10" stroke="#1F1B16" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M96 2 L114 10 L96 18" stroke="#1F1B16" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <p class="subtitle">A one-on-one, AI-guided conversation that turns implicit values into a living investor profile.</p>
    </div>

    <div class="circle">
      Reflect ·<br/>Articulate ·<br/>Move capital
    </div>
  </div>
</div>

<div class="hint">Card is 1200 × 630 · screenshot the card area, save as og-image.png</div>

</body>
</html>
